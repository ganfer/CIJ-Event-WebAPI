<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title data-i18n="eventsPortalTitle">Events Portal - All Events</title>
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/event-grid.css">
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>
    <header class="event-portal-page-header">
        <div class="event-portal-top-header-content">
            <div class="event-portal-home-section">
                <img src="assets/home.svg" alt="Home" class="event-portal-home-icon" data-i18n-attrs="alt" data-i18n-alt="home">
                <span class="event-portal-home-text" data-i18n="home">Home</span>
            </div>
            <div class="event-portal-header-actions">
                <div class="event-portal-language-container">
                    <select id="event-portal-language-select" data-i18n-attrs="title" data-i18n-title="selectLanguage" title="Select Language">
                        <!-- Language options will be populated by JavaScript -->
                    </select>
                </div>
                <div class="event-portal-theme-switcher" role="group" aria-label="Color theme" data-i18n-attrs="aria-label" data-i18n-aria-label="colorTheme">
                    <button type="button" class="event-portal-theme-option" data-theme-choice="system" aria-pressed="true" title="Use system theme" data-i18n-attrs="title" data-i18n-title="useSystemTheme"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" stroke-width="1.8"/><path d="M8 20h8M12 16v4" stroke-width="1.8" stroke-linecap="round"/></svg><span class="event-portal-theme-option-label" data-i18n="themeSystem">System</span></button>
                    <button type="button" class="event-portal-theme-option" data-theme-choice="light" aria-pressed="false" title="Use light theme" data-i18n-attrs="title" data-i18n-title="useLightTheme"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke-width="1.8" stroke-linecap="round"/></svg><span class="event-portal-theme-option-label" data-i18n="themeLight">Light</span></button>
                    <button type="button" class="event-portal-theme-option" data-theme-choice="dark" aria-pressed="false" title="Use dark theme" data-i18n-attrs="title" data-i18n-title="useDarkTheme"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="event-portal-theme-option-label" data-i18n="themeDark">Dark</span></button>
                    <span class="event-portal-theme-status" data-theme-status aria-live="polite">Theme: System</span>
                </div>
            </div>
        </div>
        <div class="event-portal-header-content">
            <h1 class="event-portal-header-title" data-i18n="allEvents">All Events</h1>
            <div class="event-portal-search-container">
                <div class="event-portal-search-input-wrapper"><div class="event-portal-search-icon"><img src="assets/search.svg" alt="Search" data-i18n-attrs="alt" data-i18n-alt="searchAlt"></div><input type="text" id="event-portal-search-input" placeholder="Search ..." data-i18n-attrs="placeholder" data-i18n-placeholder="searchPlaceholder"></div>
                <div class="event-portal-sort-container"><select id="event-portal-sort-select" data-i18n-attrs="title" data-i18n-title="sortByTitle" title="Sort by"><option value="a-z" data-i18n="sortOptionAZ">A - Z</option><option value="z-a" data-i18n="sortOptionZA">Z - A</option><option value="newest" data-i18n="sortOptionNewest">Newest</option><option value="oldest" data-i18n="sortOptionOldest">Oldest</option></select></div>
            </div>
        </div>
    </header>
    <main><div id="event-portal-events-container"><p id="event-portal-loading-message" data-i18n="loadingEvents">Loading events...</p></div></main>
    <script src="js/theme.js"></script>
    <script src="lib/PublicApi.bundle.js"></script>
    <script src="js/config.js"></script>
    <script src="js/security.js"></script>
    <script src="js/localization.js"></script>
    <script src="js/portal-localization-runtime.js"></script>
    <script src="js/event-translations.js"></script>
    <script src="js/api-wrapper.js"></script>
    <script src="js/event-grid.js"></script>
</body>
</html>
