<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Event details and registration">
    <title data-i18n="eventRegistration">Event Registration</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/event-details.css">
</head>

<body class="event-portal-event-details-page">
    <header class="event-portal-page-header event-portal-details-header">
        <div class="event-portal-top-header-content">
            <a href="index.html" class="event-portal-home-section" title="Home" data-i18n-attrs="title" data-i18n-title="home">
                <img src="assets/home.svg" alt="Home" class="event-portal-home-icon">
                <span class="event-portal-home-text" data-i18n="home">Home</span>
            </a>
            <div class="event-portal-language-container">
                <select id="event-portal-language-select" class="hidden" data-i18n-attrs="title" data-i18n-title="selectLanguage" title="Select Language">
                    <!-- Language options will be populated by JavaScript -->
                </select>
            </div>
        </div>
    </header>

    <main class="event-portal-page-main event-portal-details-main">
        <div id="event-portal-page-loading" class="event-portal-detail-loading" role="status" aria-live="polite">
            <div class="event-portal-loading-spinner" aria-hidden="true"></div>
            <p>Loading event...</p>
        </div>

        <div id="event-portal-detail-error" class="event-portal-error-message hidden" role="alert"></div>

        <article id="event-portal-event-content" class="event-portal-event-content hidden">
            <section class="event-portal-detail-hero" aria-labelledby="event-portal-event-title">
                <div class="event-portal-detail-hero-copy">
                    <p class="event-portal-eyebrow">Event</p>
                    <h1 id="event-portal-event-title"></h1>
                    <p id="event-portal-event-date" class="event-portal-detail-hero-meta"></p>
                    <p id="event-portal-event-location" class="event-portal-detail-hero-meta hidden"></p>
                    <a href="#event-portal-registration-section" class="event-portal-primary-button">Register now</a>
                </div>
                <div id="event-portal-event-image-wrapper" class="event-portal-detail-hero-media hidden">
                    <img id="event-portal-event-image" alt="">
                </div>
            </section>

            <div class="event-portal-detail-layout">
                <div class="event-portal-detail-main-column">
                    <section id="event-portal-about-section" class="event-portal-content-section">
                        <p class="event-portal-section-kicker">Overview</p>
                        <h2>About this event</h2>
                        <div id="event-portal-event-description" class="event-portal-rich-text"></div>
                    </section>

                    <section id="event-portal-sessions-section" class="event-portal-content-section hidden">
                        <p class="event-portal-section-kicker">Schedule</p>
                        <h2>Agenda</h2>
                        <div id="event-portal-sessions-list" class="event-portal-session-list"></div>
                    </section>

                    <section id="event-portal-speakers-section" class="event-portal-content-section hidden">
                        <p class="event-portal-section-kicker">People</p>
                        <h2>Speakers</h2>
                        <div id="event-portal-speakers-list" class="event-portal-speaker-grid"></div>
                    </section>
                </div>

                <aside class="event-portal-summary-card" aria-label="Event details">
                    <p class="event-portal-section-kicker">At a glance</p>
                    <h2>Event details</h2>

                    <div class="event-portal-summary-item">
                        <span class="event-portal-summary-label">Date &amp; time</span>
                        <strong id="event-portal-summary-date"></strong>
                    </div>

                    <div id="event-portal-summary-location-row" class="event-portal-summary-item hidden">
                        <span class="event-portal-summary-label">Location</span>
                        <strong id="event-portal-summary-location"></strong>
                        <span id="event-portal-summary-address" class="event-portal-summary-secondary hidden"></span>
                    </div>

                    <a href="#event-portal-registration-section" class="event-portal-secondary-button">Go to registration</a>
                </aside>
            </div>

            <section id="event-portal-registration-section" class="event-portal-registration-section" aria-labelledby="event-portal-registration-title">
                <div class="event-portal-registration-heading">
                    <p class="event-portal-section-kicker">Registration</p>
                    <h2 id="event-portal-registration-title" data-i18n="eventRegistration">Event Registration</h2>
                    <p>Complete the form below to register for this event.</p>
                </div>
                <div id="event-portal-registration-form-container">
                    <p id="event-portal-loading-message" data-i18n="loadingForm">Loading registration form...</p>
                </div>
            </section>
        </article>
    </main>

    <!-- Load the API library first -->
    <script src="lib/PublicApi.bundle.js"></script>

    <!-- Load configuration -->
    <script src="js/config.js"></script>

    <!-- Load localization before other scripts -->
    <script src="js/localization.js"></script>

    <!-- Then load our wrapper and details code -->
    <script src="js/api-wrapper.js"></script>
    <script src="js/event-details.js"></script>
    <script src="js/event-details-runtime-fix.js"></script>
</body>

</html>
