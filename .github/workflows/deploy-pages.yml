name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy static event portal
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        env:
          EVENTS_BASE_URL: ${{ secrets.EVENTS_BASE_URL }}
          EVENTS_ORG_ID: ${{ secrets.EVENTS_ORG_ID }}
          EVENTS_API_TOKEN: ${{ secrets.EVENTS_API_TOKEN }}
          EVENTS_WEBAPP_ID: ${{ secrets.EVENTS_WEBAPP_ID }}
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site
          cp -a public/. _site/
          touch _site/.nojekyll

          node <<'NODE'
          const fs = require('fs');

          const required = ['EVENTS_ORG_ID', 'EVENTS_API_TOKEN'];
          const missing = required.filter((name) => !process.env[name]);

          if (missing.length > 0) {
            console.error(`Missing required GitHub Actions secret(s): ${missing.join(', ')}`);
            process.exit(1);
          }

          const config = {
            BASE_URL: process.env.EVENTS_BASE_URL || 'https://public-eur.mkt.dynamics.com',
            ORG_ID: process.env.EVENTS_ORG_ID,
            TOKEN: process.env.EVENTS_API_TOKEN,
            WEBAPP_ID: process.env.EVENTS_WEBAPP_ID || ''
          };

          const output = [
            '/**',
            ' * Generated during GitHub Pages deployment.',
            ' * Do not commit production values to the repository.',
            ' */',
            `const CONFIG = ${JSON.stringify(config, null, 4)};`,
            ''
          ].join('\n');

          fs.writeFileSync('_site/js/config.js', output, 'utf8');
          NODE

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
