name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: npm checks and static build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check translations for published events
        env:
          EVENTS_BASE_URL: ${{ secrets.EVENTS_BASE_URL }}
          EVENTS_ORG_ID: ${{ secrets.EVENTS_ORG_ID }}
          EVENTS_API_TOKEN: ${{ secrets.EVENTS_API_TOKEN }}
          EVENTS_WEBAPP_ID: ${{ secrets.EVENTS_WEBAPP_ID }}
          EVENT_TRANSLATION_REQUIRED_LOCALES: en-US,de-DE,it-IT,fr-FR,es-ES,pt-PT,pl-PL,cs-CZ
        run: npm run check:translations

      - name: Build static site
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
