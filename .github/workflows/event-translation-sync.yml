name: Event Translation Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write

concurrency:
  group: event-translation-sync
  cancel-in-progress: false

jobs:
  translate:
    name: Sync and translate event content
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install translator
        run: pip install 'googletrans==4.0.2'

      - name: Sync English source from Events API
        env:
          EVENTS_BASE_URL: ${{ secrets.EVENTS_BASE_URL }}
          EVENTS_ORG_ID: ${{ secrets.EVENTS_ORG_ID }}
          EVENTS_API_TOKEN: ${{ secrets.EVENTS_API_TOKEN }}
          EVENTS_WEBAPP_ID: ${{ secrets.EVENTS_WEBAPP_ID }}
        run: node scripts/sync-event-sources.mjs

      - name: Sync extended registration form copy
        env:
          EVENTS_BASE_URL: ${{ secrets.EVENTS_BASE_URL }}
          EVENTS_ORG_ID: ${{ secrets.EVENTS_ORG_ID }}
          EVENTS_API_TOKEN: ${{ secrets.EVENTS_API_TOKEN }}
          EVENTS_WEBAPP_ID: ${{ secrets.EVENTS_WEBAPP_ID }}
        run: node scripts/sync-form-copy.mjs

      - name: Translate supplemental portal UI
        run: python scripts/translate-portal-ui.py

      - name: Translate event files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            event_key="$(basename "$source_file" .source.json)"
            output_file="public/translations/events/${event_key}.json"
            python scripts/translate-event-content.py "$source_file" "$output_file"
          done < <(find public/translations/events -maxdepth 1 -type f -name '*.source.json' -print | sort)

      - name: Translate registration form files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d public/translation/forms ]; then
            echo "No registration form translation sources found."
            exit 0
          fi

          while IFS= read -r source_file; do
            form_key="$(basename "$source_file" .source.json)"
            output_file="public/translation/forms/${form_key}.json"
            python scripts/translate-form-content-extended.py "$source_file" "$output_file"
          done < <(find public/translation/forms -maxdepth 1 -type f -name '*.source.json' -print | sort)

      - name: Run project checks
        run: npm test

      - name: Validate event translations
        env:
          EVENTS_BASE_URL: ${{ secrets.EVENTS_BASE_URL }}
          EVENTS_ORG_ID: ${{ secrets.EVENTS_ORG_ID }}
          EVENTS_API_TOKEN: ${{ secrets.EVENTS_API_TOKEN }}
          EVENTS_WEBAPP_ID: ${{ secrets.EVENTS_WEBAPP_ID }}
        run: npm run check:translations

      - name: Build static site
        run: npm run build

      - name: Commit synchronized translations
        shell: bash
        run: |
          git add public/translations/events public/translation/forms public/translation/portal

          if git diff --cached --quiet -- public/translations/events public/translation/forms public/translation/portal; then
            echo "No translation changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: sync portal, event and form translations"
          git push
