name: Bootstrap Portal Locales

on:
  push:
    branches:
      - chore/bootstrap-portal-locales

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install translator
        run: pip install 'googletrans==4.0.2'

      - name: Fill missing portal locale keys
        run: python scripts/translate-portal-ui.py

      - name: Commit generated locale translations
        shell: bash
        run: |
          git add public/locales
          if git diff --cached --quiet -- public/locales; then
            echo "All portal locale files are already complete."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: bootstrap portal locale translations [skip ci]"
          git push
